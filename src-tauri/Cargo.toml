[package]
name = "spelling-launcher"
version = "1.0.0"
description = "Spelling Launcher - Personal writing and sentence rewriting desktop app"
authors = ["Antigravity"]
edition = "2021"

[lib]
name = "spelling_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
dirs = "5"
thiserror = "1"
regex = "1"
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2.7.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
