[workspace]
members = [
    "src-tauri",
    "crates/spellcore",
    "crates/spellcheck-cli",
]
resolver = "2"

[workspace.package]
license = "MIT"
edition = "2021"
authors = ["Spelling Launcher Contributors"]


[profile.release]
panic = "unwind"
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
