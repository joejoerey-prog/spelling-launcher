[package]
name = "spellcheck-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Antigravity"]
description = "Standalone command-line spell checker backed by spellcore"

[dependencies]
spellcore = { path = "../spellcore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
